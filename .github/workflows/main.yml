name: Deploy

on:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create enviroment file
        run: |
          echo "DATABASE_URL=postgresql://root:password@localhost:5433/task_manager_db" >> .env.test
          echo "SECRET_KEY="secret_access_key" >> .env.test
          echo "SECRET_REFRESH_KEY="secret_refresh_key" >> .env.test

      - name: Install dependencies
        run: npm ci --include=dev

      - name: ESLint
        run: npm run eslint:check

      - name: Prettier
        run: npm run prettier:check

      - name: Test
        run: npm run test
