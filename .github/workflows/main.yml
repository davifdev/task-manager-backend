name: Deploy

on:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: task_manager_db

        ports:
          - 5433:5432

        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create enviroment file
        run: |
          echo "DATABASE_URL=postgres://root:password@localhost:5433/task_manager_db" >> .env.test
          echo "SECRET_KEY=secret_access_key" >> .env.test
          echo "SECRET_REFRESH_KEY=secret_refresh_key" >> .env.test

      - name: Install dependencies
        run: npm ci --include=dev

      - name: ESLint
        run: npm run eslint:check

      - name: Prettier
        run: npm run prettier:check

      - name: Run migrations
        run: npm run migrate:test

      - name: Test
        run: npm run test
  migrate:
    runs-on: ubuntu-latest
    needs: check
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: npm ci --include=dev

      - name: Run migrations
        run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SECRET_REFRESH_KEY: ${{ secrets.SECRET_REFRESH_KEY }}
  deploy:
    runs-on: ubuntu-latest
    needs: migrate
    environment: Production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl "$deploy_url"
